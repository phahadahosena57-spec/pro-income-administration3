<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Pro Income Administration</title>

    <link rel="stylesheet" href="assets/admin.css">
    <link rel="stylesheet" href="assets/login.css">
</head>

<body>

    <div class="login-page">

        <div class="login-box">

            <div class="login-logo">
                PIA
            </div>

            <h1>Admin Login</h1>

            <p>Pro Income Administration</p>

            <form id="loginForm">

                <label>
                    Admin Email
                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Enter admin email"
                        required
                    >
                </label>

                <label>
                    Password
                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter password"
                        required
                    >
                </label>

                <button type="submit">
                    Login
                </button>

                <div id="loginMessage"></div>

            </form>

        </div>

    </div>

    <script src="assets/login.js"></script>

</body>
</html>
